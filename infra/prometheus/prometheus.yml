global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "target-app-services"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "orders:8001"
          - "payment:8002"
          - "inventory:8003"
          - "auth:8004"
