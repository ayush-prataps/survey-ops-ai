route:
  receiver: "surveyops-webhook"
  group_by: ["alertname", "handler"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: "surveyops-webhook"
    webhook_configs:
      - url: "http://surveyops-api:8000/investigate"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/token
